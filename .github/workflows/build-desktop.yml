name: Build desktop app

# Builda o instalador do Windows e publica como GitHub Release toda vez
# que uma tag "desktop-v*" e enviada (ex: desktop-v1.0.1). O
# electron-updater do app instalado usa esses Releases pra checar e baixar
# atualizacoes sozinho.
on:
  push:
    tags:
      - "desktop-v*"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: ilammy/msvc-dev-cmd@v1

      - name: Compile loopback_helper.exe (captura de audio nativa)
        working-directory: desktop/native/loopback-helper
        run: cl /nologo /EHsc /std:c++17 /O2 /W4 loopback_helper.cpp /link /OUT:..\..\loopback_helper.exe

      - name: Install dependencies
        run: npm install

      # Identifica esse build especifico (commit) mesmo quando a VERSAO
      # nao muda -- embutido no instalador (ver extraResources) e comparado
      # com o mesmo arquivo publicado na release (passo mais abaixo) pra o
      # app detectar sozinho quando uma correcao nova sai pra versao que ja
      # esta instalada, sem precisar de bump de versao pra cada ajuste
      # pequeno (ver checkForPatch em main.js).
      - name: Registra o commit desse build
        shell: bash
        run: |
          echo "{\"commit\": \"${{ github.sha }}\"}" > build-info.json

      # Recursos em teste ficam atras do interruptor "Permitir versoes
      # beta" (ver src/lib/beta.ts), dentro da mesma versao normal -- nao
      # existe mais instalador beta separado, entao toda tag publica como
      # release estavel de verdade.
      - name: Build and publish
        shell: bash
        run: npm run release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # O proprio electron-builder RECUSA sobrescrever os artefatos quando a
      # Release ja existe ha mais de 2 horas (protecao interna dele contra
      # publicar em cima de uma release "antiga" por engano) -- o passo
      # anterior ainda GERA os arquivos normalmente em release/, so pula o
      # upload nesse caso. Isso aqui garante o upload de verdade sempre,
      # inclusive pra correcoes ("patch") na MESMA versao ja publicada --
      # --clobber sobrescreve o que ja estava la, sem criar nada duplicado.
      - name: Garante que os artefatos ficam publicados de verdade
        shell: bash
        run: |
          TAG="v$(node -p "require('./package.json').version")"
          gh release upload "$TAG" release/GameShare-Setup.exe release/GameShare-Setup.exe.blockmap release/latest.yml build-info.json --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
