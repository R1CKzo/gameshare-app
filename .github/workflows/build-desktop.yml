name: Build desktop app

# Builda o instalador do Windows e publica como GitHub Release toda vez
# que uma tag "desktop-v*" e enviada (ex: desktop-v1.0.1). O
# electron-updater do app instalado usa esses Releases pra checar e baixar
# atualizacoes sozinho.
on:
  push:
    tags:
      - "desktop-v*"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: ilammy/msvc-dev-cmd@v1

      - name: Compile loopback_helper.exe (captura de audio nativa)
        working-directory: desktop/native/loopback-helper
        run: cl /nologo /EHsc /std:c++17 /O2 /W4 loopback_helper.cpp /link /OUT:..\..\loopback_helper.exe

      - name: Install dependencies
        run: npm install

      # Tag com "-beta" (ex: desktop-v1.0.11-beta.1) publica como prerelease
      # do GitHub em vez de release normal -- nunca aparece em
      # /releases/latest (o site e o auto-update normal ignoram sozinhos),
      # so aparece pra quem ligar "Permitir versoes beta" nas Configuracoes
      # do app (ver src/lib/desktop.ts checkBetaBuild). channel=beta e
      # necessario mesmo sem o app usar canal do electron-updater pra beta
      # -- sem essa flag o provider do GitHub sobrescreve o latest.yml da
      # versao estavel de qualquer jeito (bug ja visto antes).
      - name: Build and publish
        shell: bash
        run: |
          if [[ "${{ github.ref_name }}" == *-beta* ]]; then
            npm run release -- -c.publish.releaseType=prerelease -c.publish.channel=beta
          else
            npm run release
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
