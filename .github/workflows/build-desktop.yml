name: Build desktop app

# Builda o instalador do Windows e publica como GitHub Release toda vez
# que uma tag "desktop-v*" e enviada (ex: desktop-v1.0.1). O
# electron-updater do app instalado usa esses Releases pra checar e baixar
# atualizacoes sozinho.
on:
  push:
    tags:
      - "desktop-v*"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: ilammy/msvc-dev-cmd@v1

      - name: Compile loopback_helper.exe (captura de audio nativa)
        working-directory: desktop/native/loopback-helper
        run: cl /nologo /EHsc /std:c++17 /O2 /W4 loopback_helper.cpp /link /OUT:..\..\loopback_helper.exe

      - name: Install dependencies
        run: npm install

      # Tag com "-beta" na versao (ex: desktop-v1.0.9-beta.1) publica como
      # pre-lancamento -- o electron-builder ja gera um beta.yml separado
      # do latest.yml sozinho a partir do sufixo de prerelease na versao
      # do package.json, entao quem esta na trilha estavel nunca ve esse
      # build (ver applyUpdaterChannel em main.js).
      - name: Build and publish
        shell: bash
        run: |
          if [[ "${GITHUB_REF_NAME}" == *-beta* ]]; then
            npm run release -- -c.publish.releaseType=prerelease
          else
            npm run release
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
