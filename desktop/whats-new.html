<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<title>Novidades do GameShare</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    background: #08090d;
    color: #f5f5f7;
    font-family: -apple-system, "Segoe UI", Manrope, Arial, sans-serif;
  }
  body { padding: 30px 34px 22px; }
  .badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: rgba(124, 58, 237, 0.15);
    color: #a78bfa;
    font-size: 12px;
    font-weight: 700;
    padding: 4px 10px;
    border-radius: 999px;
    margin-bottom: 14px;
  }
  h1 { font-size: 21px; font-weight: 800; margin: 0 0 8px; }
  .intro { color: #9aa0ae; font-size: 13.5px; margin: 0 0 20px; line-height: 1.5; }
  #content { max-height: 54vh; overflow-y: auto; padding-right: 6px; }
  .section { margin-bottom: 20px; }
  .section h2 {
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: #22d3ee;
    margin: 0 0 10px;
  }
  ul { margin: 0; padding-left: 18px; }
  li { font-size: 13.5px; line-height: 1.6; color: #d5d7dc; margin-bottom: 6px; }
  .footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    margin-top: 22px;
    padding-top: 18px;
    border-top: 1px solid rgba(255, 255, 255, 0.08);
  }
  label {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 12.5px;
    color: #838a99;
    cursor: pointer;
  }
  input[type="checkbox"] { accent-color: #7c3aed; }
  button {
    background: #7c3aed;
    color: white;
    border: none;
    font-weight: 700;
    font-size: 13.5px;
    padding: 10px 22px;
    border-radius: 999px;
    cursor: pointer;
    flex-shrink: 0;
  }
  button:hover { background: #8b5cf6; }
  #content::-webkit-scrollbar { width: 8px; }
  #content::-webkit-scrollbar-thumb { background: #242938; border-radius: 999px; }
</style>
</head>
<body>
  <div class="badge">✨ Novidades</div>
  <h1 id="title"></h1>
  <p class="intro" id="intro"></p>
  <div id="content"></div>
  <div class="footer">
    <label><input type="checkbox" id="dontShow" /> Não mostrar essa versão de novo</label>
    <button id="continueBtn">Continuar</button>
  </div>

  <script>
    (async () => {
      const changelog = await window.gameshareDesktop.getChangelog();
      document.getElementById("title").textContent = changelog.title;
      document.getElementById("intro").textContent = changelog.intro;

      const content = document.getElementById("content");
      for (const section of changelog.sections) {
        const div = document.createElement("div");
        div.className = "section";

        const h2 = document.createElement("h2");
        h2.textContent = section.heading;
        div.appendChild(h2);

        const ul = document.createElement("ul");
        for (const item of section.items) {
          const li = document.createElement("li");
          li.textContent = item;
          ul.appendChild(li);
        }
        div.appendChild(ul);
        content.appendChild(div);
      }
    })();

    document.getElementById("continueBtn").addEventListener("click", () => {
      const dontShow = document.getElementById("dontShow").checked;
      window.gameshareDesktop.dismiss(dontShow);
    });
  </script>
</body>
</html>
