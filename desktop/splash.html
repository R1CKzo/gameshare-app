<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<title>GameShare</title>
<style>
  html, body {
    margin: 0;
    height: 100%;
    background: #0b0d12;
    color: #f5f5f7;
    font-family: -apple-system, "Segoe UI", Manrope, Arial, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    -webkit-user-select: none;
    user-select: none;
  }

  .box {
    text-align: center;
    width: 100%;
    max-width: 320px;
    padding: 0 24px;
  }

  /* Logo: dois arcos girando em sentidos opostos (efeito "orbita quebrada")
     + faisca central pulsando + brilho suave por baixo de tudo. Puro
     SVG/CSS, sem imagem nenhuma -- precisa renderizar mesmo offline, antes
     de qualquer conexao ter sido confirmada. */
  .logo-wrap {
    position: relative;
    width: 128px;
    height: 128px;
    margin: 0 auto 28px;
  }
  .glow {
    position: absolute;
    inset: -20px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(124, 92, 246, 0.35), transparent 70%);
    filter: blur(6px);
    animation: pulse-glow 2.6s ease-in-out infinite;
  }
  @keyframes pulse-glow {
    0%, 100% { opacity: 0.6; transform: scale(0.96); }
    50% { opacity: 1; transform: scale(1.04); }
  }
  .ring {
    position: absolute;
    inset: 0;
    animation: spin 3.2s linear infinite;
  }
  .ring.reverse {
    animation-direction: reverse;
    animation-duration: 4.6s;
    opacity: 0.55;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .sparkle {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 34px;
    height: 34px;
    margin: -17px 0 0 -17px;
    animation: pulse-sparkle 1.8s ease-in-out infinite;
  }
  @keyframes pulse-sparkle {
    0%, 100% { transform: scale(0.85); opacity: 0.85; }
    50% { transform: scale(1.05); opacity: 1; }
  }

  h1 {
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.28em;
    text-transform: uppercase;
    color: #c9cbe0;
    margin: 0 0 16px;
  }
  .track {
    height: 4px;
    width: 100%;
    border-radius: 999px;
    background: rgba(255, 255, 255, 0.08);
    overflow: hidden;
  }
  .bar {
    height: 100%;
    width: 40%;
    border-radius: 999px;
    background: linear-gradient(90deg, #7c5cf6, #5aa4f7);
    animation: slide 1.4s ease-in-out infinite;
  }
  @keyframes slide {
    0% { transform: translateX(-100%); }
    100% { transform: translateX(350%); }
  }

  @media (prefers-reduced-motion: reduce) {
    .glow, .ring, .sparkle, .bar { animation: none; }
  }
</style>
</head>
<body>
  <div class="box">
    <div class="logo-wrap">
      <div class="glow"></div>
      <svg class="ring" viewBox="0 0 128 128" fill="none" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="arcA" x1="0" y1="0" x2="128" y2="128" gradientUnits="userSpaceOnUse">
            <stop offset="0" stop-color="#7c5cf6" />
            <stop offset="1" stop-color="#5aa4f7" />
          </linearGradient>
        </defs>
        <path d="M100 34C90 20 74 12 57 13" stroke="url(#arcA)" stroke-width="7" stroke-linecap="round" />
        <path d="M28 94C38 108 54 116 71 115" stroke="url(#arcA)" stroke-width="7" stroke-linecap="round" />
        <circle cx="100" cy="34" r="7" fill="#8b6cf7" />
        <circle cx="28" cy="94" r="6" fill="#6f8ff5" />
      </svg>
      <svg class="ring reverse" viewBox="0 0 128 128" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M22 46C26 30 40 18 57 15" stroke="#5aa4f7" stroke-width="3" stroke-linecap="round" opacity="0.5" />
        <path d="M106 82C102 98 88 110 71 113" stroke="#7c5cf6" stroke-width="3" stroke-linecap="round" opacity="0.5" />
      </svg>
      <svg class="sparkle" viewBox="0 0 34 34" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M17 1C17.8 10 24 16.2 33 17C24 17.8 17.8 24 17 33C16.2 24 10 17.8 1 17C10 16.2 16.2 10 17 1Z" fill="#efeaff" />
      </svg>
    </div>
    <h1 id="status">Conectando...</h1>
    <div class="track"><div class="bar"></div></div>
  </div>
  <script>
    // splash-preload.js expoe isso -- o processo principal manda o texto
    // certo pra cada etapa (checar atualizacao, baixar, instalar,
    // conectando) sem precisar de nenhuma logica de verdade aqui, essa
    // pagina so reflete o que chega.
    if (window.gameshareSplash) {
      window.gameshareSplash.onStatus((text) => {
        document.getElementById("status").textContent = text;
      });
    }
  </script>
</body>
</html>
